# ═══════════════════════════════════════════════
#  FLASH PANEL — Cloudflare Worker config
#  ⚡ one file + one D1 database — that's the whole stack
# ═══════════════════════════════════════════════
name = "flash-panel"
main = "flash-panel-worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# your private gate — the panel opens ONLY at /m/<GATE>
# [IMPORTANT] replace with your own random secret, e.g. from: openssl rand -hex 8
[vars]
GATE = "change-me-to-a-random-secret"

[[d1_databases]]
binding = "DB"
database_name = "flash-db"
# run `npx wrangler d1 create flash-db` and paste the printed id here:
database_id = "REPLACE_WITH_YOUR_D1_ID"

[triggers]
crons = ["*/5 * * * *"]
